<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — GuyZ3R0</title>
<link rel="icon" type="image/png" href="assets/avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<link rel="stylesheet" href="shared/site.css">
<script src="shared/fx.js"></script>
</helmet>
<canvas ref="{{ cvRef }}" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none"></canvas>
<nav style="position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:rgba(10,4,13,0.88);backdrop-filter:blur(8px);border-bottom:2px solid #1b123e">
  <a href="home.html" style="font-family:'Silkscreen',monospace;font-weight:700;font-size:18px;letter-spacing:1px;color:#ffffff">Guy<span style="color:#00ff90">Z3R0</span></a>
  <div style="display:flex;align-items:center;gap:22px;font-family:'JetBrains Mono',monospace;font-size:13px">
    <a href="home.html" style="color:#eae6f2">HOME</a>
    <a href="blog.html" style="color:#ffcc37">BLOG</a>
    <a href="projects.html" style="color:#eae6f2">PROJECTS</a>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <div style="display:flex;border:2px solid #1e1e90;background:#1b123e">
      <sc-for list="{{ modeBtns }}" as="m" hint-placeholder-count="3">
        <button onClick="{{ m.onClick }}" title="Animation mode" style="{{ m.style }}">{{ m.label }}</button>
      </sc-for>
    </div>
    <button data-btn="1" onClick="{{ toggleBg }}" title="Toggle animated background" style="{{ bgBtnStyle }}">BG</button>
  </div>
</nav>
<main style="position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 24px">
  <sc-if value="{{ showIndex }}" hint-placeholder-val="{{ true }}">
    <section style="padding:56px 0 40px">
      <h1 style="font-family:'Silkscreen',monospace;font-size:38px;color:#ffcc37;margin:0;letter-spacing:1px">THE BLOG</h1>
      <p style="font-family:'JetBrains Mono',monospace;font-size:14px;color:#8f86ad;margin:12px 0 0">&gt; what I'm building, breaking, and thinking<span style="animation:gz-blink 1.1s step-end infinite">_</span></p>
    </section>
    <section style="padding:0 0 110px;display:flex;flex-direction:column;gap:26px">
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
        <p style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#8f86ad">LOADING POSTS...</p>
      </sc-if>
      <sc-for list="{{ posts }}" as="p" hint-placeholder-count="3">
        <article data-post="1" onClick="{{ p.open }}" style="display:flex;gap:0;background:#1b123e;border:2px solid #1e1e90;cursor:pointer;transition:transform .18s, border-color .18s, box-shadow .18s;box-shadow:6px 6px 0 0 #12093a;overflow:hidden" style-hover="transform: translate(-3px,-3px); border-color: #ffcc37; box-shadow: 9px 9px 0 0 #12093a">
          <div data-cover="1" style="flex:0 0 200px;min-height:170px;background:#12093a;border-right:2px solid #1e1e90;display:flex;align-items:center;justify-content:center">
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:2px;color:#2c2260">COVER</span>
          </div>
          <div style="padding:22px 26px;display:flex;flex-direction:column;gap:10px;min-width:0">
            <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#8f86ad">{{ p.date }}</span>
            <h2 style="font-size:22px;font-weight:700;color:#ffffff;margin:0;line-height:1.3;text-wrap:pretty">{{ p.title }}</h2>
            <p style="font-size:15px;line-height:1.6;color:#c9c2dd;margin:0;text-wrap:pretty">{{ p.excerpt }}</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:2px">
              <sc-for list="{{ p.tags }}" as="t" hint-placeholder-count="2">
                <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#00ff90;border:1px solid #1e1e90;padding:3px 8px">{{ t }}</span>
              </sc-for>
            </div>
          </div>
        </article>
      </sc-for>
    </section>
  </sc-if>
  <sc-if value="{{ showPost }}" hint-placeholder-val="{{ false }}">
    <section style="padding:44px 0 110px">
      <button data-btn="1" onClick="{{ closePost }}" style="background:#1b123e;border:2px solid #1e1e90;color:#eae6f2;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;padding:9px 16px;cursor:pointer;letter-spacing:1px" style-hover="border-color: #00ff90; color: #00ff90">&#9664; ALL POSTS</button>
      <h1 style="font-size:40px;font-weight:700;color:#ffffff;margin:34px 0 10px;line-height:1.2;text-wrap:pretty">{{ postTitle }}</h1>
      <p style="font-family:'JetBrains Mono',monospace;font-size:13px;color:#8f86ad;margin:0 0 36px">{{ postDate }}</p>
      <div data-md="1">{{ postBody }}</div>
    </section>
  </sc-if>
</main>
<footer style="position:relative;z-index:1;border-top:2px solid #1b123e;padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
  <span style="font-family:'Silkscreen',monospace;font-size:14px;color:#ffffff">Guy<span style="color:#00ff90">Z3R0</span></span>
  <span style="display:flex;gap:18px;font-family:'JetBrains Mono',monospace;font-size:12px">
    <a href="home.html" style="color:#8f86ad">HOME</a>
    <a href="projects.html" style="color:#8f86ad">PROJECTS</a>
  </span>
  <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#5c5378">&#169; 2026 GuyZ3R0 &#183; built block by block</span>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: null}">
class Component extends DCLogic {
  state = { mode: 'subtle', bgOn: true, posts: [], loading: true, current: null };
  cvRef = (el) => { this.cv = el; };
  componentDidMount() {
    let mode = 'subtle';
    try {
      const saved = localStorage.getItem('gz-anim-mode');
      if (saved === 'max' || saved === 'subtle' || saved === 'zero') mode = saved;
      const bg = localStorage.getItem('gz-bg-on');
      this.setState({ mode, bgOn: bg === null ? true : bg === '1' });
    } catch (e) {}
    this.startFX();
    this._onHash = () => this.openFromHash();
    addEventListener('hashchange', this._onHash);
    this.loadPosts();
  }
  componentWillUnmount() {
    if (this._fx) this._fx.destroy();
    clearTimeout(this._fxT);
    removeEventListener('hashchange', this._onHash);
  }
  // Wires the shared background/ripple/hover engine (shared/fx.js) to this page
  startFX() {
    if (!window.GZ) { this._fxT = setTimeout(() => this.startFX(), 120); return; }
    this._fx = GZ.initFX({
      canvas: () => this.cv,
      mode: () => this.state.mode,
      bgOn: () => this.state.bgOn,
      exclude: 'button, a, article, input, textarea, [data-btn], nav, footer, [data-md]'
    });
  }
  parseFrontmatter(src) {
    const meta = {};
    let body = src;
    if (src.startsWith('---')) {
      const end = src.indexOf('\n---', 3);
      if (end > 0) {
        src.slice(3, end).split('\n').forEach((line) => {
          const i = line.indexOf(':');
          if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
        });
        body = src.slice(end + 4).replace(/^\s+/, '');
      }
    }
    return { meta, body };
  }
  async loadPosts() {
    try {
      const files = await (await fetch('posts/index.json')).json();
      const posts = [];
      for (const f of files) {
        try {
          const src = await (await fetch('posts/' + f)).text();
          const { meta, body } = this.parseFrontmatter(src);
          const para = body.split(/\n{2,}/).find((p) => p && !p.startsWith('#') && !p.startsWith('!') && !p.startsWith('```')) || '';
          posts.push({
            slug: f.replace(/\.md$/, ''),
            title: meta.title || f,
            date: meta.date || '',
            cover: meta.cover || '',
            tags: meta.tags ? meta.tags.split(',').map((t) => t.trim()) : [],
            excerpt: para.replace(/[*_`>#\[\]]/g, '').slice(0, 150) + (para.length > 150 ? '\u2026' : ''),
            body
          });
        } catch (e) {}
      }
      posts.sort((a, b) => (a.date < b.date ? 1 : -1));
      this.setState({ posts, loading: false }, () => this.openFromHash());
    } catch (e) {
      this.setState({ loading: false });
    }
  }
  openFromHash() {
    const m = location.hash.match(/^#p=(.+)$/);
    if (!m) { this.setState({ current: null }); return; }
    const post = this.state.posts.find((p) => p.slug === decodeURIComponent(m[1]));
    if (post) { this.setState({ current: post }); scrollTo(0, 0); }
  }
  setMode(m) {
    try { localStorage.setItem('gz-anim-mode', m); } catch (e) {}
    this.setState({ mode: m });
  }
  toggleBg = () => {
    const v = !this.state.bgOn;
    try { localStorage.setItem('gz-bg-on', v ? '1' : '0'); } catch (e) {}
    this.setState({ bgOn: v });
  };
  renderVals() {
    const { mode, bgOn, posts, loading, current } = this.state;
    const btn = (active) => ({
      padding: '7px 12px', border: 'none', cursor: 'pointer', fontFamily: "'JetBrains Mono',monospace",
      fontWeight: 700, fontSize: '11px', letterSpacing: '0.5px',
      background: active ? '#00ff90' : 'transparent', color: active ? '#0a040d' : '#8f86ad'
    });
    const modeBtns = [
      { label: 'MAX', onClick: () => this.setMode('max'), style: btn(mode === 'max') },
      { label: 'SUB', onClick: () => this.setMode('subtle'), style: btn(mode === 'subtle') },
      { label: 'ZERO', onClick: () => this.setMode('zero'), style: btn(mode === 'zero') }
    ];
    const bgBtnStyle = {
      padding: '7px 12px', cursor: 'pointer', fontFamily: "'JetBrains Mono',monospace", fontWeight: 700,
      fontSize: '11px', border: '2px solid ' + (bgOn ? '#00ff90' : '#1e1e90'),
      background: '#1b123e', color: bgOn ? '#00ff90' : '#8f86ad'
    };
    let postBody = null;
    if (current) {
      const html = window.marked ? window.marked.parse(current.body) : '<p>' + current.body.replace(/</g, '&lt;') + '</p>';
      postBody = React.createElement('div', { dangerouslySetInnerHTML: { __html: html } });
    }
    return {
      cvRef: this.cvRef, modeBtns, bgBtnStyle, toggleBg: this.toggleBg,
      loading,
      showIndex: !current, showPost: !!current,
      posts: posts.map((p) => ({ ...p, open: () => { location.hash = 'p=' + encodeURIComponent(p.slug); } })),
      postTitle: current ? current.title : '',
      postDate: current ? current.date : '',
      postBody,
      closePost: () => { location.hash = ''; }
    };
  }
}
</script>
</body>
</html>
